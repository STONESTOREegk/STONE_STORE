<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(30,30)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#2d5f2e" stroke-width="2"/>
    <!-- Compass arms -->
    <polygon points="0,-18 4,0 0,2" fill="#2d5f2e"/>
    <polygon points="0,18 -4,0 0,-2" fill="#2d5f2e"/>
    <polygon points="18,0 0,4 0,-2" fill="#2d5f2e"/>
    <polygon points="-18,0 0,-4 0,2" fill="#2d5f2e"/>
